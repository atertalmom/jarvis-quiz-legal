<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OAuth — JARVIS Quiz</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 48rem; margin: 0 auto; padding: 2rem 1.35rem; line-height: 1.7; background: #fafbfc; color: #12151c; }
    h1 { color: #0d3b66; font-size: 1.5rem; }
    code { word-break: break-all; background: #eef2f7; padding: 0.2rem 0.45rem; border-radius: 6px; border: 1px solid #e6e9ef; }
    a { color: #1e6bb8; }
  </style>
</head>
<body>
  <h1>Autorização TikTok</h1>
  <p id="status">Processando autorização…</p>
  <p id="show-code"></p>
  <form id="finish-form" method="POST" action="http://localhost:3455/oauth/finish" style="display:none">
    <input type="hidden" name="code" id="code-field" />
    <input type="hidden" name="state" id="state-field" />
  </form>
  <p><a href="index.html">Voltar ao início</a></p>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var c = p.get("code") || p.get("auth_code") || "";
      var state = p.get("state") || "";
      var err = p.get("error") || "";
      var el = document.getElementById("show-code");
      var st = document.getElementById("status");
      if (err) {
        st.textContent = "Erro OAuth: " + err;
        window.location.replace("http://localhost:3455/oauth/finish?error=" + encodeURIComponent(err));
        return;
      }
      if (c) {
        st.textContent = "Enviando code ao JARVIS Quiz (localhost)…";
        el.innerHTML = "<strong>Code recebido (parcial):</strong> <code>" + c.substring(0, 24) + "…</code>";
        document.getElementById("code-field").value = c;
        document.getElementById("state-field").value = state;
        document.getElementById("finish-form").submit();
        return;
      }
      st.textContent = "Nenhum code na URL. Inicie o fluxo OAuth a partir do painel JARVIS Quiz.";
    })();
  </script>
  <p style="margin-top:2rem;color:#9aa3b2;font-size:0.9rem;">English: OAuth redirect for TikTok Login Kit (Web). POSTs code to local JARVIS Quiz panel.</p>
</body>
</html>
